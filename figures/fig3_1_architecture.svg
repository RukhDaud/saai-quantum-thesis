<path d="M340.0,710 L340.0,760" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M340.0,830 L340.0,870" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M340.0,960 L340.0,1000" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M340.0,1090 L340.0,1130" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M620,295.0 L660,295.0" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#a)"/>
<path d="M620,420.0 L660,420.0" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#a)"/>
<path d="M620,660.0 L660,660.0" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#a)"/>
<path d="M620,915.0 L660,915.0" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#a)"/>
<path d="M620,1045.0 L660,1045.0" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#a)"/>
<path d="M60,1045.0 L30,1045 L30,295 L60,295.0" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#a)"/>
</svg>