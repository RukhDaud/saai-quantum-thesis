<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210" font-family="Times New Roman, Liberation Serif, serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333333"/></marker></defs>
<rect width="1000" height="1210" fill="#FFFFFF"/>
<rect x="60" y="20" width="560" height="80" rx="8" fill="#FFF2CC" stroke="#333333" stroke-width="1.4"/>
<text x="340.0" y="43.36" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Safety requirements (natural language)</text>
<text x="340.0" y="60.0" font-size="13" text-anchor="middle" dominant-baseline="middle">EU Implementing Regulation 2022/1426, Annexes II and III</text>
<text x="340.0" y="76.64" font-size="13" text-anchor="middle" dominant-baseline="middle">UN Regulation No 157 (ALKS), paragraphs 2, 5, 6 and 7</text>
<rect x="60" y="140" width="560" height="70" rx="8" fill="#DAE8FC" stroke="#333333" stroke-width="1.4"/>
<text x="340.0" y="158.36" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1  Requirements corpus</text>
<text x="340.0" y="175.0" font-size="13" text-anchor="middle" dominant-baseline="middle">441 verbatim statements with stable identifiers</text>
<text x="340.0" y="191.64000000000001" font-size="13" text-anchor="middle" dominant-baseline="middle">(370 from EU 2022/1426; 71 from UN R157)</text>
<rect x="60" y="250" width="560" height="90" rx="8" fill="#DAE8FC" stroke="#333333" stroke-width="1.4"/>
<text x="340.0" y="270.04" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2  Formal ODD condition library</text>
<text x="340.0" y="286.68" font-size="13" text-anchor="middle" dominant-baseline="middle">29 conditions: dimension, variable, operator, threshold, unit, response</text>
<text x="340.0" y="303.32000000000005" font-size="13" text-anchor="middle" dominant-baseline="middle">ODD conditions | performance limits | boundary responses | activation</text>
<text x="340.0" y="319.96000000000004" font-size="13" text-anchor="middle" dominant-baseline="middle">Threshold recorded only when the clause states it</text>
<rect x="60" y="380" width="560" height="80" rx="8" fill="#DAE8FC" stroke="#333333" stroke-width="1.4"/>
<text x="340.0" y="403.36" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3  Phase A: executable ODD boundary predicates</text>
<text x="340.0" y="420.0" font-size="13" text-anchor="middle" dominant-baseline="middle">P1 to P8, each a Boolean test on a scenario,</text>
<text x="340.0" y="436.64" font-size="13" text-anchor="middle" dominant-baseline="middle">carrying the identifier of its source clause</text>
<rect x="60" y="500" width="560" height="70" rx="8" fill="#E1D5E7" stroke="#333333" stroke-width="1.4"/>
<text x="340.0" y="526.68" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold">4  ODD scenario space and candidate pool</text>
<text x="340.0" y="543.3199999999999" font-size="13" text-anchor="middle" dominant-baseline="middle">6 dimensions (972 concrete scenarios); pool of n candidates, budget k</text>
<rect x="60" y="610" width="560" height="100" rx="8" fill="#E1D5E7" stroke="#333333" stroke-width="1.4"/>
<text x="340.0" y="635.04" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold">5  Phase B: QUBO scenario selection</text>
<text x="340.0" y="651.68" font-size="13" text-anchor="middle" dominant-baseline="middle">Coverage-aligned objective: min  −Σ |Pi| xi + Σ |Pi ∩ Pj| xi xj + C(Σ xi − k)²</text>
<text x="340.0" y="668.3199999999999" font-size="13" text-anchor="middle" dominant-baseline="middle">Solvers: QAOA (statevector simulator), exact enumeration,</text>
<text x="340.0" y="684.9599999999999" font-size="13" text-anchor="middle" dominant-baseline="middle">simulated annealing, genetic algorithm, greedy; sub-QUBO decomposition</text>
<rect x="60" y="760" width="560" height="70" rx="8" fill="#D5E8D4" stroke="#333333" stroke-width="1.4"/>
<text x="340.0" y="786.68" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold">6  Executable test scenarios</text>
<text x="340.0" y="803.3199999999999" font-size="13" text-anchor="middle" dominant-baseline="middle">ASAM OpenSCENARIO 1.1 files with ODD levels, predicates and source clauses</text>
<rect x="60" y="870" width="560" height="90" rx="8" fill="#D5E8D4" stroke="#333333" stroke-width="1.4"/>
<text x="340.0" y="890.04" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold">7  Simulation-based execution</text>
<text x="340.0" y="906.68" font-size="13" text-anchor="middle" dominant-baseline="middle">Longitudinal model of the UN R157 ALKS, cross-checked against esmini</text>
<text x="340.0" y="923.3199999999999" font-size="13" text-anchor="middle" dominant-baseline="middle">Environment effects from published measurements (friction, visibility); planted faults</text>
<text x="340.0" y="939.9599999999999" font-size="13" text-anchor="middle" dominant-baseline="middle">Oracle: collision = FAIL (EU 2022/1426 Annex III 1.4.2)</text>
<rect x="60" y="1000" width="560" height="90" rx="8" fill="#F8CECC" stroke="#333333" stroke-width="1.4"/>
<text x="340.0" y="1028.36" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold">8  Evaluation and traceability</text>
<text x="340.0" y="1045.0" font-size="13" text-anchor="middle" dominant-baseline="middle">Coverage, fault detection, computational cost, statistical tests</text>
<text x="340.0" y="1061.6399999999999" font-size="13" text-anchor="middle" dominant-baseline="middle">Trace audit: result → scenario → predicate → condition → clause</text>
<rect x="60" y="1130" width="560" height="60" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.4"/>
<text x="340.0" y="1151.68" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Traceable, optimised verification evidence</text>
<text x="340.0" y="1168.3200000000002" font-size="13" text-anchor="middle" dominant-baseline="middle">for ODD boundaries of automated driving systems</text>
<rect x="660" y="250" width="320" height="90" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="820.0" y="278.36" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Traceability matrix</text>
<text x="820.0" y="295.0" font-size="13" text-anchor="middle" dominant-baseline="middle">clause → condition → predicate</text>
<text x="820.0" y="311.64" font-size="13" text-anchor="middle" dominant-baseline="middle">→ code representation (or gap)</text>
<rect x="660" y="380" width="320" height="80" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="820.0" y="403.36" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold">RQ1</text>
<text x="820.0" y="420.0" font-size="13" text-anchor="middle" dominant-baseline="middle">Share of requirements mapped to a</text>
<text x="820.0" y="436.64" font-size="13" text-anchor="middle" dominant-baseline="middle">traceable ODD boundary predicate</text>
<rect x="660" y="610" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="820.0" y="635.04" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Reference optimum</text>
<text x="820.0" y="651.68" font-size="13" text-anchor="middle" dominant-baseline="middle">exhaustive enumeration (n ≤ 20) or</text>
<text x="820.0" y="668.3199999999999" font-size="13" text-anchor="middle" dominant-baseline="middle">integer linear programme (n &gt; 20)</text>
<text x="820.0" y="684.9599999999999" font-size="13" text-anchor="middle" dominant-baseline="middle">RQ2: coverage   RQ3: cost and scale</text>
<rect x="660" y="870" width="320" height="90" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="820.0" y="898.36" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold">RQ2</text>
<text x="820.0" y="915.0" font-size="13" text-anchor="middle" dominant-baseline="middle">Fault detection of the selected</text>
<text x="820.0" y="931.64" font-size="13" text-anchor="middle" dominant-baseline="middle">scenario sets in simulation</text>
<rect x="660" y="1000" width="320" height="90" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="820.0" y="1028.36" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold">RQ4</text>
<text x="820.0" y="1045.0" font-size="13" text-anchor="middle" dominant-baseline="middle">Trace completeness and change</text>
<text x="820.0" y="1061.6399999999999" font-size="13" text-anchor="middle" dominant-baseline="middle">propagation after a requirement edit</text>
<rect x="21" y="560" width="18" height="190" rx="8" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="30.0" y="655.0" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 30.0 655.0)">requirement change</text>
